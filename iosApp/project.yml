# XcodeGen spec for the Chika iOS app. The Xcode project is generated, not committed:
#   xcodegen generate --spec iosApp/project.yml --project iosApp
# The Kotlin :shared framework is built by a pre-build script phase (and explicitly in CI), so
# opening the generated project in Xcode "just works" as long as a JDK is on PATH.
name: Chika
options:
  bundleIdPrefix: com.chakra
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # App Store versioning: CI overrides these per release (see release-ios workflow); the
    # defaults keep local archives valid. CURRENT_PROJECT_VERSION must increase monotonically
    # per App Store Connect upload.
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
    # Automatic signing. Set your Apple Developer Team ID here (Xcode → Settings → Accounts),
    # or override with xcodebuild DEVELOPMENT_TEAM=XXXXXXXXXX for CI/App Store archives.
    CODE_SIGN_STYLE: Automatic

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  # FOSS RAR5 reader: libarchive's BSD-licensed C library as a prebuilt xcframework. We depend on
  # the raw `libarchive` C product (not the package's Swift wrapper, whose writer fails Swift 6
  # strict-concurrency checks on current toolchains) and read it via a small C-API wrapper — we
  # only need to read CBR/RAR and repackage as CBZ.
  SwiftArchive:
    url: https://github.com/matteo-pacini/libarchive-for-swift
    exactVersion: "1.0.0"

targets:
  Chika:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
      - package: SwiftArchive
        product: libarchive
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chika
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The app uses no encryption beyond what the OS provides — declares export compliance so
        # App Store Connect uploads don't stall on the manual questionnaire.
        ITSAppUsesNonExemptEncryption: false
        # Mac App Store category (ignored on iOS).
        LSApplicationCategoryType: public.app-category.books
        UILaunchScreen: {}
        UIAppFonts:
          - Anton-Regular.ttf
          - Archivo-Variable.ttf
        # Landscape matters for a comic reader (wide panels/spreads); iPad must support all
        # orientations for App Store review.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # macOS rejects NO here. The app never handles files opened from outside (imports only via
        # its own file picker), so YES changes no behavior on either platform.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Book Archive
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.chakra.comicreader.cbz
              - com.chakra.comicreader.cbr
              - public.zip-archive
        # Exported (not Imported): the app OWNS these types, so the system knows .cbz is a zip and
        # .cbr a data file — otherwise the file importer greys these files out as unselectable.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.chakra.comicreader.cbz
            UTTypeDescription: Comic Book ZIP Archive
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
          - UTTypeIdentifier: com.chakra.comicreader.cbr
            UTTypeDescription: Comic Book RAR Archive
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chakra.comicreader
        TARGETED_DEVICE_FAMILY: "1,2"
        # Mac Catalyst: the same app on the Mac, sharing the iOS bundle ID so it's one App Store
        # record (universal purchase). Apple silicon only — the Kotlin framework is built for
        # macosArm64 (see scripts/build-shared.sh). "Designed for iPad" is off: Catalyst replaces it.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "ARCHS[sdk=macosx*]": arm64
        # The Mac App Store requires the App Sandbox; iOS is sandboxed by the OS and needs no file.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Chika-macOS.entitlements
        # All SDK variants are conditional — an unconditional device path would also be passed to
        # simulator links, and ld picks whichever framework it finds first once both have been
        # built locally.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=macosx*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/macCatalystArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ChikaShared"
    preBuildScripts:
      - name: Build Kotlin shared framework
        script: exec "$SRCROOT/scripts/build-shared.sh"
        basedOnDependencyAnalysis: false

schemes:
  Chika:
    build:
      targets:
        Chika: all
    run:
      config: Debug
    archive:
      config: Release
