name: Release

# Tag a commit (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build a signed
# release AAB + APK and publish them on a GitHub Release.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same JDK as CI (the project's jvmTarget is 17), so a release is built exactly like the
      # commit CI tested.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu image ships the Android SDK. android-actions/setup-android@v3 now fails there
      # ("Failed to find package 'tools'"), so use the preinstalled SDK directly. compileSdk 36 /
      # buildToolsVersion 36.1.0 are pinned in app/build.gradle.kts; installing them here makes a
      # missing version fail fast with a clear message.
      - name: Set up Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          # Redirect from process substitution (not a pipe): `yes | sdkmanager` dies of SIGPIPE under
          # the runner's default `bash -e -o pipefail`.
          "$SDKMANAGER" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Gate the signed release on the shared test suite (a tag on a red commit must not ship).
      - name: Shared module unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:jvmTest --stacktrace

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Build signed AAB + APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      # R8 is enabled, so keep the deobfuscation map with every release — Play crash
      # reports (and any bug report against this build) are unreadable without it.
      - name: Package R8 mapping
        run: |
          cp app/build/outputs/mapping/release/mapping.txt \
             "mapping-${{ steps.ver.outputs.name }}.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags with a suffix (e.g. v0.2.0-beta, v1.0.0-rc1) publish as a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            mapping-*.txt
